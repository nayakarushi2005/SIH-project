# Tests, then deploys ai-service/ to Cloud Run (sih-ai). Runs on every push to
# main that touches ai-service/, or from the Actions tab ("Run workflow").
# Env vars and the Vertex key mount carry over from the last deploy.
name: Deploy AI service

on:
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ai
  cancel-in-progress: false

env:
  REGION: asia-south1

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless login to Google Cloud
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy (sih-ai)
        run: gcloud run deploy sih-ai --source ai-service --region "$REGION" --quiet

      - name: Health check
        run: |
          URL=$(gcloud run services describe sih-ai --region "$REGION" --format='value(status.url)')
          BODY=$(curl -fsS --retry 3 --retry-delay 5 "$URL/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"vertexConfigured":true' || { echo "Vertex AI is not configured"; exit 1; }
