# Cloud Run env for sih-ai. Copy to deploy/ai.env.yaml (gitignored) and fill in.
# Do NOT set PORT — Cloud Run sets it.
NODE_API_URL: "https://<sih-backend URL>/api"
MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/<db>"
GOOGLE_CLOUD_PROJECT: "<gcp-project-id>"
GOOGLE_CLOUD_LOCATION: "asia-south1"
# The key is mounted from Secret Manager at this path (see deployment_guide.md).
GOOGLE_APPLICATION_CREDENTIALS: "/secrets/vertex/key.json"
GEMINI_MODEL: "gemini-3.8-flash"
LOG_LEVEL: "INFO"
