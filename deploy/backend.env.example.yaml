# Cloud Run env for sih-backend and sih-dispatcher (same file for both).
# Copy to deploy/backend.env.yaml (gitignored) and fill in. Values are strings.
# Do NOT set PORT — Cloud Run sets it.
NODE_ENV: "production"
MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/<db>"
JWT_SECRET: "<long random string — same as today, or every user is signed out>"
JWT_EXPIRES_IN: "7d"
GOOGLE_WEB_CLIENT_ID: "<...>.apps.googleusercontent.com"
MEON_SECRET_TOKEN: "<...>"
MEON_COMPANY_CODE: "<...>"
MEON_COMPANY_NAME: "<...>"
MEON_BASE_URL: "https://api.meon.co.in"
CLOUDINARY_CLOUD_NAME: "<...>"
CLOUDINARY_API_KEY: "<...>"
CLOUDINARY_API_SECRET: "<...>"
# Managed Redis with TLS, e.g. Upstash: rediss://default:<password>@<host>:6379
REDIS_URL: "rediss://default:<password>@<host>:6379"
VERTEX_PROJECT_ID: "<gcp-project-id>"
VERTEX_LOCATION: "global"
# The key is mounted from Secret Manager at this path (see deployment_guide.md).
VERTEX_KEY_FILE: "/secrets/vertex/key.json"
# The web portal's URL, for CORS (e.g. https://<project>.web.app).
CLIENT_ORIGIN: "https://<portal-domain>"
SAFETY_TIMEZONE: "Asia/Kolkata"
