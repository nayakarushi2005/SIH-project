[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls real Vertex AI (needs credentials); run with -m live"]
addopts = "-m 'not live'"

[tool.ruff.lint.per-file-ignores]
# Spoken sentences and test tables read better unwrapped.
"app/agents/onboarding/messages.py" = ["E501"]
"tests/*" = ["E501"]
