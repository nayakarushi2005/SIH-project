# ──────────────────────────────────────────────────────────────────────────────
# SIH Project – docker-compose.yml
#
# Usage:
#   docker compose up --build        (dev / first run)
#   docker compose up -d             (detached, production)
#   docker compose down              (stop & remove)
#   docker compose logs -f backend   (tail logs)
# ──────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Runs dispatch rounds (matching workers to jobs) from the Redis queue.
  dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-dispatcher
    restart: unless-stopped
    command: ["node", "dispatcher.js"]
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true # the image's check pings the HTTP API, which this process doesn't serve

  # Job queue for the dispatcher. For local dev run just this:
  #   docker compose up -d redis
  redis:
    image: redis:7-alpine
    container_name: sih-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # localhost only — never expose Redis publicly
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
